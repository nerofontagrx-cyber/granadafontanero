<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <defs>
    <linearGradient id="laton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D27A"/>
      <stop offset=".45" stop-color="#D9A83A"/>
      <stop offset="1" stop-color="#9C6B12"/>
    </linearGradient>
    <linearGradient id="latonV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8771B"/>
      <stop offset=".5" stop-color="#F0C964"/>
      <stop offset="1" stop-color="#A8771B"/>
    </linearGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9ECEF"/>
      <stop offset=".5" stop-color="#B9C0C7"/>
      <stop offset="1" stop-color="#8A939C"/>
    </linearGradient>
    <radialGradient id="cristal" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#EAF1FB"/>
      <stop offset="1" stop-color="#C9D8EE"/>
    </radialGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4FC4"/>
      <stop offset="1" stop-color="#02258B"/>
    </linearGradient>
  </defs>
  <!-- tuberías -->
  <rect x="4" y="150" width="70" height="34" rx="6" fill="url(#tubo)"/>
  <rect x="246" y="150" width="70" height="34" rx="6" fill="url(#tubo)"/>
  <!-- tuercas -->
  <rect x="62" y="140" width="28" height="54" rx="5" fill="url(#latonV)"/>
  <rect x="230" y="140" width="28" height="54" rx="5" fill="url(#latonV)"/>
  <!-- cuerpo -->
  <rect x="84" y="146" width="152" height="42" rx="12" fill="url(#laton)"/>
  <!-- cuello -->
  <rect x="112" y="118" width="96" height="36" rx="8" fill="url(#laton)"/>
  <!-- esfera exterior -->
  <ellipse cx="160" cy="118" rx="92" ry="34" fill="#7A520D"/>
  <ellipse cx="160" cy="110" rx="92" ry="34" fill="url(#laton)"/>
  <!-- tapa azul abierta -->
  <path d="M84 96 Q160 14 236 96 Q160 70 84 96Z" fill="url(#tapa)"/>
  <!-- cristal -->
  <ellipse cx="160" cy="108" rx="74" ry="26" fill="url(#cristal)" stroke="#7A520D" stroke-width="3"/>
  <!-- contador numérico -->
  <rect x="122" y="96" width="76" height="16" rx="3" fill="#14110F"/>
  <g font-family="Space Mono, monospace" font-size="12" font-weight="700" fill="#F7F3EA" text-anchor="middle">
    <text x="132" y="108.5">0</text><text x="144" y="108.5">4</text><text x="156" y="108.5">2</text><text x="168" y="108.5">7</text>
  </g>
  <rect x="174" y="96" width="24" height="16" rx="0" fill="#C8102E"/>
  <g font-family="Space Mono, monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="180" y="108.5">3</text><text x="192" y="108.5">1</text>
  </g>
  <!-- agujas pequeñas -->
  <circle cx="138" cy="122" r="6" fill="#fff" stroke="#14110F" stroke-width="1.5"/>
  <line x1="138" y1="122" x2="141" y2="118" stroke="#C8102E" stroke-width="2"/>
  <circle cx="182" cy="122" r="6" fill="#fff" stroke="#14110F" stroke-width="1.5"/>
  <line x1="182" y1="122" x2="178" y2="119" stroke="#C8102E" stroke-width="2"/>
  <!-- brillo -->
  <ellipse cx="132" cy="97" rx="26" ry="6" fill="#fff" opacity=".55"/>
  <!-- flecha de flujo -->
  <path d="M136 172 h44 l-8 -7 m8 7 l-8 7" fill="none" stroke="#7A520D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
